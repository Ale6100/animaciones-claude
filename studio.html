<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd Animation Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Shantell+Sans:wght@800&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 10px; max-width: 1280px; margin: 0 auto; }
  #out { width: 100%; aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 12px; align-items: center; background: #26222d; padding: 10px 14px; border-radius: 8px; }
  #scrub { flex: 1; cursor: pointer; accent-color: #00D8FE; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; color: #bbb; }
  .btn {
    background: #00D8FE; color: #111; font-weight: 700; border: none; border-radius: 6px;
    padding: 7px 18px; cursor: pointer; font-size: 14px; transition: transform 0.1s, background 0.2s;
  }
  .btn:hover { background: #5ee5ff; transform: scale(1.03); }
  .btn:active { transform: scale(0.97); }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar">
    <button id="playBtn" class="btn">▶ Play</button>
    <input id="scrub" type="range" min="0" max="11" step="0.0417" value="0">
    <span id="tt">0.00s</span>
  </div>
  <audio id="bgAudio" preload="auto"></audio>
</main>

<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/timeline.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>

<!-- Active scene: change to src/scenes/claude_pop.js for K-pop style -->
<script src="src/scenes/demo.js"></script>
<!-- <script src="src/scenes/claude_pop.js"></script> -->

<script>
  const audio = document.getElementById('bgAudio');
  const playBtn = document.getElementById('playBtn');
  const scrub = document.getElementById('scrub');
  const tt = document.getElementById('tt');
  let isPlaying = false;
  let playStartT = 0, playStartWall = 0;

  function getMaxTime() {
    return window.LOOP ? window.LOOP.len : (typeof DUR !== 'undefined' ? DUR : 11);
  }

  function initControls() {
    const maxT = getMaxTime();
    scrub.max = maxT;
    if (typeof PROJECT !== 'undefined' && PROJECT.audio) {
      audio.src = PROJECT.audio;
    }
    tt.textContent = `0.00s / ${maxT.toFixed(2)}s`;
  }
  setTimeout(initControls, 200);

  function togglePlay() {
    const maxT = getMaxTime();
    if (!isPlaying) {
      let curT = +scrub.value;
      if (curT >= maxT) curT = 0;
      playStartT = curT;
      playStartWall = performance.now();
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      playBtn.style.background = '#ffd166';

      if (audio.src) {
        audio.currentTime = curT;
        audio.play().catch(e => console.log('Audio autoplay policy:', e));
      }
      syncLoop();
    } else {
      pausePlay();
    }
  }

  function pausePlay() {
    isPlaying = false;
    playBtn.textContent = '▶ Play';
    playBtn.style.background = '#00D8FE';
    if (audio.src) audio.pause();
  }

  playBtn.addEventListener('click', togglePlay);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    }
  });

  async function syncLoop() {
    if (!isPlaying) return;
    const maxT = getMaxTime();
    let curT = 0;
    if (audio.src && !audio.paused) {
      curT = audio.currentTime;
    } else {
      const elapsed = (performance.now() - playStartWall) / 1000;
      curT = playStartT + elapsed;
    }

    if (curT >= maxT) {
      curT = maxT;
      scrub.value = curT;
      await window.renderAt(curT);
      tt.textContent = `${curT.toFixed(2)}s / ${maxT.toFixed(2)}s`;
      pausePlay();
      playBtn.textContent = '▶ Replay';
      return;
    }

    scrub.value = curT;
    await window.renderAt(curT);
    tt.textContent = `${curT.toFixed(2)}s / ${maxT.toFixed(2)}s`;
    requestAnimationFrame(syncLoop);
  }

  scrub.addEventListener('input', () => {
    const t = +scrub.value;
    if (audio.src) audio.currentTime = t;
    playStartT = t;
    playStartWall = performance.now();
    window.renderAt(t);
  });
</script>
</body>
</html>
